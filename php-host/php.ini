; Shipped next to the FrankenPHP binary by scripts/setup-php-runtime.mjs.
; PHP on Windows reads php.ini from the executable's own directory; the static
; Linux and macOS binaries read the same file through PHP_INI_SCAN_DIR, which
; the Rust sidecar sets to a directory holding this file's per-device twin
; (crates/php-host/src/sandbox.rs: open_basedir, disable_functions and the
; stream locks). Keep this file to what the runtime needs to load.
extension_dir = "ext"
extension=pdo_sqlite
extension=sqlite3
extension=mbstring
extension=curl
