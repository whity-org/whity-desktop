[workspace]
resolver = "2"
members = ["src-tauri", "crates/php-host"]

# One lock file and one `target/` for the app and its crates. CI runs
# `cargo clippy --workspace` and `cargo test --workspace` from here.
[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT"
authors = ["Whity contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "time", "io-util", "macros", "rt-multi-thread", "sync", "process", "io-std"] }
